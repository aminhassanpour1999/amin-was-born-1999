name: Draw 1999 artwork

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "TEST first; FULL only after TEST is visible"
        required: true
        type: choice
        options:
          - TEST
          - FULL
        default: TEST
      confirmation:
        description: "Explicitly confirm the selected operation"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      email:
        description: "Email verified on your GitHub account"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draw-1999-artwork
  cancel-in-progress: false

jobs:
  draw:
    if: inputs.confirmation == 'YES'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Show artwork preview
        run: python a_m_in_was_born.py --preview

      - name: Create selected commits
        env:
          MODE: ${{ inputs.mode }}
          CONTRIBUTION_EMAIL: ${{ inputs.email }}
        run: |
          python a_m_in_was_born.py --mode "${MODE,,}" --email "$CONTRIBUTION_EMAIL"

      - name: Push commits
        run: git push origin HEAD:main
